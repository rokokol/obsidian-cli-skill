name: ci

# Nothing here reaches a mirror, a :latest image or a live site, so it is a gate rather
# than a detector and pull requests run it too
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  # Called by vendor-sync.yml against its temp branch, so new vendored copies are checked by
  # this file rather than by a copy of its commands
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # The whole history: the gate reads every earlier recording of tests/obsidian-help.txt,
      # so a command the CLI stopped declaring is caught wherever the docs still name it
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31
      - name: check.sh (the gate, self-tested against known-bad fixtures)
        run: nix develop --no-write-lock-file -c ./check.sh

  # The bash 3.2 half of the gate, for the cascade alone. vendor-sync.yml verifies a
  # branch by calling this workflow, so a copy that breaks the 3.2 claim would land
  # green without this job. An ordinary push has no inputs.ref and skips it, because
  # macos.yml runs on its own trigger there, which is where its badge comes from
  bash32:
    if: inputs.ref != ''
    uses: ./.github/workflows/macos.yml
    with:
      ref: ${{ inputs.ref }}
